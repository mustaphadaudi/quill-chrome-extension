<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quill</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">Q</span><div><h1>Quill</h1><p>Your words, a little clearer.</p></div><span class="version">0.1</span></header>
    <section class="control"><div><h2>Writing assistant</h2><p>Show Quill beside text fields</p></div><label class="switch"><input id="enabled" type="checkbox" disabled aria-label="Enable writing assistant"><span aria-hidden="true"></span></label></section>
    <section class="notice"><span class="dot" aria-hidden="true"></span><div><h2>Foundation ready</h2><p>The floating widget is available. Gemini spelling, grammar and tone checks arrive in the next development stage.</p></div></section>
    <p id="status" role="status" aria-live="polite">Loading preferences…</p>
    <footer>Personal edition <span>All features will be included</span></footer>
  </main>
</body>
</html>
