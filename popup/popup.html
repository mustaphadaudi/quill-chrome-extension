<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quill</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">Q</span><div><h1>Quill</h1><p>Your words, a little clearer.</p></div><span class="version">0.3</span></header>
    <section class="control"><div><h2>Writing assistant</h2><p>Show Quill beside text fields</p></div><label class="switch"><input id="enabled" type="checkbox" disabled aria-label="Enable writing assistant"><span aria-hidden="true"></span></label></section>
    <section class="notice"><span class="dot" aria-hidden="true"></span><div><h2>Write with confidence</h2><p>Grammar, spelling and tone suggestions, powered by your personal Gemini key.</p></div></section>
    <button id="pad" type="button">Open writing pad</button><button id="settings" type="button">Open settings ↗</button><p id="status" role="status" aria-live="polite">Loading preferences…</p>
    <footer>Personal edition <span>All features included</span></footer>
  </main>
</body>
</html>
