<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quill writing pad</title><link rel="stylesheet" href="workbench.css"><script type="module" src="workbench.js"></script></head><body><main><header><span class="mark">Q</span><div><h1>Your writing, clearer.</h1><p>Paste a passage from Google Docs or another editor. Check it here, then copy it back.</p></div><button id="settings" type="button">Settings</button></header><div class="layout"><section><label for="source">Your passage</label><textarea id="source" placeholder="Paste or type your text here…" spellcheck="false"></textarea><div class="tools"><button id="check" type="button">Check writing</button><select id="mode" aria-label="Rewrite style"><option value="clearer">Clearer</option><option value="concise">More concise</option><option value="professional">Professional</option><option value="friendly">Friendly</option><option value="confident">Confident</option></select><button id="rewrite" type="button">Rewrite</button></div><div class="tools"><button id="copy" type="button">Copy text</button><button id="undo" type="button" disabled>Undo last edit</button></div><p class="note">The pad reads only the text you paste here. Nothing is saved as document history.</p></section><section><h2>Suggestions</h2><p id="status" role="status" aria-live="polite">Ready when you are.</p><div id="results"></div></section></div></main></body></html>
